name: Sandbox checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.16.8
      - run: ruff check .
      - run: make test
      - run: python -m pip install -r requirements-live.txt
      - run: python -m pip install .
      - run: make test
      - run: jevidence demo
      - run: jevidence evaluate
      - run: jevidence replay examples/replay-synthetic.jsonl --labels --compare-route-floor 0.7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make docker-test
      - run: make docker-build docker-demo
